[project]
name = "exportstudio-engine"
version = "0.1.0"
description = "Library engine for ExportStudio: reads rekordbox 6/7 libraries via pyrekordbox"
readme = "README.md"
authors = [
    { name = "claw1200", email = "carstenwood12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mutagen>=1.48.1",
    "numpy>=2.0",
    "pyrekordbox>=0.4.4",
]

[project.scripts]
exportstudio-engine = "exportstudio_engine:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
