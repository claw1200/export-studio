[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false
rust-version = "1.89"
license = "GPL-2.0-or-later"

[workspace.dependencies]
es-decode = { path = "crates/es-decode" }
es-deck = { path = "crates/es-deck" }
es-wave = { path = "crates/es-wave" }
es-analyse = { path = "crates/es-analyse" }
es-index = { path = "crates/es-index" }
es-tags = { path = "crates/es-tags" }
es-engine = { path = "crates/es-engine" }
es-backup = { path = "crates/es-backup" }
rb-anlz = { path = "../es-rekordbox-sdk/crates/rb-anlz" }
rb-audio = { path = "../es-rekordbox-sdk/crates/rb-audio" }
rb-device = { path = "../es-rekordbox-sdk/crates/rb-device" }
rb-library = { path = "../es-rekordbox-sdk/crates/rb-library" }
rb-model = { path = "../es-rekordbox-sdk/crates/rb-model" }
rb-usb = { path = "../es-rekordbox-sdk/crates/rb-usb" }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
symphonia = { version = "0.5", default-features = false, features = [
  "mp3",
  "aac",
  "isomp4",
  "alac",
  "flac",
  "wav",
  "aiff",
  "pcm",
  "ogg",
  "vorbis",
] }
rubato = "0.16"
cpal = "0.15"
rtrb = "0.3"
rayon = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
napi = { version = "2", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "2"
napi-build = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
await_holding_lock = "deny"
needless_pass_by_value = "deny"
large_enum_variant = "deny"
inefficient_to_string = "deny"
unnecessary_to_owned = "deny"
implicit_clone = "deny"
cloned_instead_of_copied = "deny"
dbg_macro = "deny"
print_stdout = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
chunks_exact_to_as_chunks = "allow"
manual_is_multiple_of = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
debug = false

[profile.release.package.es-usb]
strip = "symbols"

[profile.test]
opt-level = 2
