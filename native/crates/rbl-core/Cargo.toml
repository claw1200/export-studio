[package]
name = "rbl-core"
version = "1.9.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared ids, time formats and error primitives for rbxport."

[lints]
workspace = true

[dependencies]
rb-model = { path = "../rb-model" }
rb-storage = { path = "../rb-storage" }
dirs = "5"
# `clock` only: the local offset for the dates rekordbox writes in local
# time. Already in the lock through other dependencies, so nothing new is built.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { workspace = true }
thiserror = { workspace = true }
